《靜夜思》李白：床前明月光，疑似地上霜。舉頭望明月，低頭思故鄉。
《登鸛雀樓》王之渙：白日依山盡，黃河入海流。欲窮千里目，更上一層樓。
《春曉》孟浩然：春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。
《宿建德江》孟浩然：移舟泊煙渚，日暮客愁新。野曠天低樹，江清月近人。
《鳥鳴澗》王維：人閒桂花落，夜靜春山空。月出驚山鳥，時鳴春澗中。
