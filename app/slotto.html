<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slotto 大樂透拉霸</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle, #222, #2f373d);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #fff;
}

.container {
  text-align: center;
  padding: 0 8%; /* 左右留白 */
  width: 100%;
  box-sizing: border-box;
}

.slots {
  display: flex;
  justify-content: center; /* 整列置中 */
  gap: 2%; /* 格子間距 */
  margin: 24px 0;
  flex-wrap: nowrap; /* 保證 6 格在同一列 */
}

.slot {
  flex: 0 1 calc((100% - 10%) / 6); /* 六格平均寬度 */
  aspect-ratio: 7/9;
  min-width: 40px;
  background: #282828;
  border-radius: 12px;
  box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 3px 6px rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: calc(2.5vw + 12px);
  font-weight: bold;
  color: #ffeb3b;
  transition: all 0.1s ease;
}

.slot.selected {
  color: #ff66aa; /* 粉紅色固定文字 */
  transform: none;
  text-shadow: none;
}

button {
  padding: 12px 28px;
  font-size: 24px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #ff66aa; /* 按鈕粉紅色 */
  color: #fff;
}

button:disabled {
  background: #777;
  cursor: not-allowed;
}

/* 手機優化 */
@media (max-width: 600px) {
  .slot {
    font-size: calc(4vw + 12px);
    min-width: 40px;
  }
}
</style>
</head>

<body>
<div class="container">
  <h1>Slotto 大樂透拉霸</h1>

  <div class="slots" id="slots">
    <div class="slot">7</div>
    <div class="slot">7</div>
    <div class="slot">7</div>
    <div class="slot">7</div>
    <div class="slot">7</div>
    <div class="slot">7</div>
  </div>

  <button id="startBtn">開始</button>
</div>

<script>
const TOTAL_NUMBERS = 49;
const SLOT_COUNT = 6;
const INTERVAL = 50;   // 每格滾動更新時間(ms)
const ROLL_COUNT = 15;  // 每格滾動次數
const STOP_DELAY = 300; // 每格停下間隔(ms)

const slots = document.querySelectorAll(".slot");
const startBtn = document.getElementById("startBtn");

let running = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateResult() {
  const pool = Array.from({ length: TOTAL_NUMBERS }, (_, i) => i + 1);
  shuffle(pool);
  return pool.slice(0, SLOT_COUNT);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// 單格滾動動畫
async function rollSlot(slot, finalNumber) {
  for (let i = 0; i < ROLL_COUNT; i++) {
    slot.textContent = Math.floor(Math.random() * TOTAL_NUMBERS) + 1;
    await sleep(INTERVAL);
  }
  slot.textContent = finalNumber;
}

async function startSlot() {
  if (running) return;
  running = true;
  startBtn.disabled = true;

  // 移除先前選定樣式
  slots.forEach(slot => slot.classList.remove("selected"));

  const finalNumbers = generateResult();

  // 依序滾動每格
  for (let i = 0; i < SLOT_COUNT; i++) {
    await rollSlot(slots[i], finalNumbers[i]);
    slots[i].classList.add("selected"); // 停下後固定粉紅色
    await sleep(STOP_DELAY); // 下一格滾動前的間隔
  }

  running = false;
  startBtn.disabled = false;
}

startBtn.addEventListener("click", startSlot);
</script>
</body>
</html>
