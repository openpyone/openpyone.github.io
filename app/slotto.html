<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slotto 大樂透拉霸 | 碼寶程式教育</title>
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      max-height: 100vh;
      overflow: hidden; /* 避免上下捲軸 */
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #222, #2f373d);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 600px; /* 最大寬度 */
      padding: 16px; /* 四周 padding */
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 2rem;
    }

    .slots {
      display: flex;
      justify-content: center;
      gap: 2%;
      margin: 16px 0;
      flex-wrap: nowrap;
    }

    .slot {
      flex: 0 1 calc((100% - 10%) / 6);
      aspect-ratio: 7/9;
      min-width: 40px;
      background: #282828;
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 3px 6px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: calc(2.5vw + 12px);
      font-weight: bold;
      color: #ffeb3b;
      transition: all 0.1s ease;
    }

    .slot.selected {
      color: #ff66aa;
      transform: none;
      text-shadow: none;
    }

    button {
      padding: 12px 28px;
      font-size: 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #ff66aa;
      color: #fff;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    /* 手機優化 */
    @media (max-width: 600px) {
      .slot {
        font-size: calc(4vw + 12px);
        min-width: 40px;
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Slotto 大樂透拉霸</h1>

  <div class="slots" id="slots">
    <div class="slot">7</div>
    <div class="slot">7</div>
    <div class="slot">7</div>
    <div class="slot">7</div>
    <div class="slot">7</div>
    <div class="slot">7</div>
  </div>

  <button id="startBtn">開始</button>
</div>

<script>
const TOTAL_NUMBERS = 49;
const SLOT_COUNT = 6;
const INTERVAL = 50;
const ROLL_COUNT = 15;
const STOP_DELAY = 300;

const slots = document.querySelectorAll(".slot");
const startBtn = document.getElementById("startBtn");

let running = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateResult() {
  const pool = Array.from({ length: TOTAL_NUMBERS }, (_, i) => i + 1);
  shuffle(pool);
  return pool.slice(0, SLOT_COUNT);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function rollSlot(slot, finalNumber) {
  for (let i = 0; i < ROLL_COUNT; i++) {
    slot.textContent = Math.floor(Math.random() * TOTAL_NUMBERS) + 1;
    await sleep(INTERVAL);
  }
  slot.textContent = finalNumber;
}

async function startSlot() {
  if (running) return;
  running = true;
  startBtn.disabled = true;

  slots.forEach(slot => slot.classList.remove("selected"));

  const finalNumbers = generateResult();

  for (let i = 0; i < SLOT_COUNT; i++) {
    await rollSlot(slots[i], finalNumbers[i]);
    slots[i].classList.add("selected");
    await sleep(STOP_DELAY);
  }

  running = false;
  startBtn.disabled = false;
}

startBtn.addEventListener("click", startSlot);
</script>
</body>
</html>
